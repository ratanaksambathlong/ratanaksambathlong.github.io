<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the map · Long Ratanaksambath</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
<script>
  try {
    const t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root { --bg: #fff; --ink: #000; --muted: #5c5c5c; --faint: #9a9a9a; --line: 0, 0, 0; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --ink: #fff; --muted: #a3a3a3; --faint: #6b6b6b; --line: 255, 255, 255; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #000; --ink: #fff; --muted: #a3a3a3; --faint: #6b6b6b; --line: 255, 255, 255; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Century Gothic", "Didact Gothic", "Avenir Next", Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main { position: fixed; left: clamp(16px, 6vw, 96px); right: 16px; bottom: clamp(32px, 10vh, 120px); }
  small {
    display: block; margin-bottom: 18px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint);
  }
  h1 { font-weight: 400; font-size: clamp(40px, 9vw, 120px); line-height: 0.95; letter-spacing: -0.02em; }
  p { margin-top: 20px; font-size: clamp(15px, 1.4vw, 18px); color: var(--muted); }
  a {
    display: inline-block; margin-top: 14px;
    color: var(--ink); font-size: clamp(15px, 1.4vw, 18px); text-decoration: none;
    border-bottom: 1px solid var(--muted); padding-bottom: 2px;
  }
  a:hover { border-bottom-color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="map" aria-hidden="true"></canvas>
<main>
  <small>404 · Elev unknown</small>
  <h1>Off the map</h1>
  <p>This page doesn&rsquo;t exist.</p>
  <a href="/">Back to Long Ratanaksambath</a>
</main>
<script>
// A still contour map, drawn once (and again on resize or theme change).
(() => {
  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  const CELL = 12, LEVELS = 22;
  const P = new Uint8Array(512);
  let s = 404;
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const rnd = (x, y) => P[(P[x & 255] + y) & 255] / 255;
  const fade = t => t * t * (3 - 2 * t);
  const lerp = (a, b, t) => a + (b - a) * t;
  const noise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = fade(x - xi), yf = fade(y - yi);
    return lerp(lerp(rnd(xi, yi), rnd(xi + 1, yi), xf), lerp(rnd(xi, yi + 1), rnd(xi + 1, yi + 1), xf), yf);
  };
  function draw() {
    const dpr = Math.max(2, Math.min(window.devicePixelRatio || 1, 3));
    const W = innerWidth, H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const line = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
    const cols = Math.ceil(W / CELL) + 1, rows = Math.ceil(H / CELL) + 1;
    const f = new Float32Array(cols * rows);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const x = i * CELL / 260, y = j * CELL / 260;
      f[j * cols + i] = noise(x, y) * 0.7 + noise(x * 2.3 + 7, y * 2.3) * 0.3;
    }
    ctx.lineJoin = ctx.lineCap = 'round';
    for (let l = 1; l < LEVELS; l++) {
      const th = l / LEVELS * 1.1 - 0.05;
      ctx.beginPath();
      for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
        const a = f[j * cols + i], b = f[j * cols + i + 1], c = f[(j + 1) * cols + i + 1], d = f[(j + 1) * cols + i];
        let k = 0;
        if (a > th) k |= 8; if (b > th) k |= 4; if (c > th) k |= 2; if (d > th) k |= 1;
        if (k === 0 || k === 15) continue;
        const x = i * CELL, y = j * CELL, t = (u, v) => (th - u) / (v - u);
        const T = [x + CELL * t(a, b), y], R = [x + CELL, y + CELL * t(b, c)];
        const B = [x + CELL * t(d, c), y + CELL], L = [x, y + CELL * t(a, d)];
        const seg = (u, v) => { ctx.moveTo(u[0], u[1]); ctx.lineTo(v[0], v[1]); };
        switch (k) {
          case 1: case 14: seg(L, B); break; case 2: case 13: seg(B, R); break;
          case 3: case 12: seg(L, R); break; case 4: case 11: seg(T, R); break;
          case 6: case 9: seg(T, B); break; case 7: case 8: seg(L, T); break;
          case 5: seg(L, T); seg(B, R); break; case 10: seg(T, R); seg(L, B); break;
        }
      }
      ctx.strokeStyle = `rgba(${line}, ${l % 5 === 0 ? 0.26 : 0.11})`;
      ctx.lineWidth = l % 5 === 0 ? 1.2 : 0.8;
      ctx.stroke();
    }
  }
  draw();
  addEventListener('resize', draw);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
})();
</script>
</body>
</html>
